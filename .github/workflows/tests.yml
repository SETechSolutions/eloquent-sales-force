name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays, to catch breakage from new framework releases.
    - cron: '0 6 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - ${{ matrix.dependencies }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        laravel: ['12.*', '13.*']
        dependencies: [highest]
        exclude:
          # Laravel 13 requires PHP 8.3.
          - php: '8.2'
            laravel: '13.*'
        include:
          # The oldest supported versions of everything, per Laravel release.
          - php: '8.2'
            laravel: '12.*'
            dependencies: lowest
          - php: '8.3'
            laravel: '13.*'
            dependencies: lowest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, intl
          coverage: none

      - name: Select the Laravel version
        run: composer require "laravel/framework:${{ matrix.laravel }}" --no-interaction --no-update

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Run the tests
        run: vendor/bin/phpunit

  quality:
    name: Code style and static analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Validate composer.json
        run: composer validate --strict

      - name: Check for known vulnerabilities
        run: composer audit

      - name: Check the code style
        run: vendor/bin/pint --test

      - name: Run static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
